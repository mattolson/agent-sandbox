name: Proxy Tests

on:
  push:
    branches: [main]
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  pull_request:
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install PyYAML mitmproxy

      - name: Run proxy unit tests
        run: python -m unittest discover -s images/proxy/tests -t images/proxy/tests -p 'test_*.py'

      - name: Run proxy integration tests
        run: python -m unittest discover -s images/proxy/tests/integration -t images/proxy/tests -p 'test_*.py'
