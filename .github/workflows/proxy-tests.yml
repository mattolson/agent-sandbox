name: Proxy Tests

on:
  push:
    branches: [main]
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  pull_request:
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install PyYAML mitmproxy

      - name: Run proxy unit tests
        run: python -m unittest discover -s images/proxy/tests -t images/proxy/tests -p 'test_*.py'

      - name: Run proxy integration tests
        run: python -m unittest discover -s images/proxy/tests/integration -t images/proxy/tests -p 'test_*.py'
