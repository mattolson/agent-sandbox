name: Proxy Tests

on:
  push:
    branches: [main]
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  pull_request:
    paths:
      - 'images/proxy/**'
      - '.github/workflows/proxy-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The mitmproxy image runs on Python 3.14; test on the same line.
          python-version: '3.14'

      - name: Read the pinned mitmproxy release
        id: mitmproxy
        run: |
          VERSION=$(sed -n 's/^ARG MITMPROXY_VERSION=//p' images/proxy/Dockerfile | head -n1)
          if [ -z "$VERSION" ]; then
            echo "images/proxy/Dockerfile has no ARG MITMPROXY_VERSION line" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mitmproxy $VERSION"

      - name: Install test dependencies
        run: pip install PyYAML "mitmproxy==${{ steps.mitmproxy.outputs.version }}"

      - name: Run proxy unit tests
        run: python -m unittest discover -s images/proxy/tests -t images/proxy/tests -p 'test_*.py'

      - name: Run proxy integration tests
        run: python -m unittest discover -s images/proxy/tests/integration -t images/proxy/tests -p 'test_*.py'
