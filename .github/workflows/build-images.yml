  build-opencode:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      opencode_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest OpenCode version from npm
        id: version
        run: |
          VERSION=$(npm view opencode-ai@latest version 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "Failed to fetch OpenCode version from npm"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "OpenCode version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPENCODE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=opencode-${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./images/agents/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}@${{ needs.build-base.outputs.digest }}
            OPENCODE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=min,scope=opencode

      - name: Output digest
        run: echo "OpenCode image digest - ${{ steps.build.outputs.digest }}"

  build-hermes:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      hermes_version: ${{ steps.version.outputs.semver }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Hermes release from GitHub
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script below: a
          # workflow_dispatch input is attacker-influenced in the same way
          # hermes_extras is, and is validated before use for the same reason.
          REQUESTED_REF: ${{ inputs.hermes_ref }}
        run: |
          # Upstream tags releases with calver (e.g. v2026.6.5) and embeds the
          # semver in the release name ("Hermes Agent v0.16.0 (2026.6.5) ...").
          # PyPI carries no link to the tag, so GitHub releases are the source
          # of truth: ref (calver tag) is cloned, calver names the image tag,
          # semver is a cosmetic label only.
          #
          # check-hermes-version.yml validates the curated extras against a
          # specific release and then dispatches this workflow with that same
          # tag in hermes_ref. Honouring it is what keeps the two workflows on
          # one release: re-resolving `latest` here would let a release cut in
          # the gap get built without ever being validated - the exact
          # two-arch build failure the guard exists to prevent. Blank (push,
          # release, or a manual run) falls back to resolving latest.
          if [ -n "$REQUESTED_REF" ]; then
            printf '%s' "$REQUESTED_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "ERROR: hermes_ref is not a calver tag (expected vYYYY.M.D): $REQUESTED_REF" >&2; exit 1; }
            echo "Building the Hermes release requested by the caller: $REQUESTED_REF"
            RELEASE=$(gh api "repos/NousResearch/hermes-agent/releases/tags/$REQUESTED_REF")
          else
            RELEASE=$(gh api repos/NousResearch/hermes-agent/releases/latest)
          fi
          REF=$(printf '%s' "$RELEASE" | jq -r .tag_name)
          NAME=$(printf '%s' "$RELEASE" | jq -r .name)
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "Failed to resolve Hermes release tag from GitHub"
            exit 1
          fi
          CALVER=${REF#v}
          SEMVER=$(printf '%s' "$NAME" | sed -nE 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          [ -n "$SEMVER" ] || SEMVER="$CALVER"
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "calver=$CALVER" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "Hermes release: $REF (semver $SEMVER)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.HERMES_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=hermes-${{ steps.version.outputs.calver }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./images/agents/hermes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}@${{ needs.build-base.outputs.digest }}
            HERMES_REF=${{ steps.version.outputs.ref }}
            HERMES_SEMVER=${{ steps.version.outputs.semver }}
            HERMES_EXTRAS=${{ inputs.hermes_extras || env.HERMES_EXTRAS }}
          cache-from: type=gha,scope=hermes
          # mode=max, unlike the single-stage images: hermes has a sqlite-builder
          # stage that compiles the SQLite amalgamation once per target platform.
          # Keep in step with images/agents/hermes/Dockerfile.
          cache-to: type=gha,mode=max,scope=hermes

      - name: Output digest
        run: echo "Hermes image digest - ${{ steps.build.outputs.digest }}"


  summary:
    runs-on: ubuntu-latest
    needs: [build-base, build-proxy, build-claude, build-copilot, build-codex, build-factory, build-gemini, build-opencode, build-pi, build-hermes]
    steps:
      - name: Summary
        run: |
          echo "## Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Claude Code version:** ${{ needs.build-claude.outputs.claude_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Copilot CLI version:** ${{ needs.build-copilot.outputs.copilot_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Codex CLI version:** ${{ needs.build-codex.outputs.codex_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Factory CLI version:** ${{ needs.build-factory.outputs.factory_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Gemini CLI version:** ${{ needs.build-gemini.outputs.gemini_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**OpenCode version:** ${{ needs.build-opencode.outputs.opencode_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pi coding agent version:** ${{ needs.build-pi.outputs.pi_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Hermes agent version:** ${{ needs.build-hermes.outputs.hermes_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-base | \`${{ needs.build-base.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-proxy | \`${{ needs.build-proxy.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-claude | \`${{ needs.build-claude.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-copilot | \`${{ needs.build-copilot.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-codex | \`${{ needs.build-codex.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-factory | \`${{ needs.build-factory.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-gemini | \`${{ needs.build-gemini.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-opencode | \`${{ needs.build-opencode.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-pi | \`${{ needs.build-pi.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-sandbox-hermes | \`${{ needs.build-hermes.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
